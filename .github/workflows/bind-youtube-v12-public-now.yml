name: bind-youtube-v12-public-now

on:
  push:
    branches:
      - docs/youtube-v12-public-now

permissions:
  contents: write

jobs:
  bind-publication:
    if: ${{ !contains(github.event.head_commit.message, '[youtube-public-bound]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/youtube-v12-public-now
          fetch-depth: 0

      - name: Update canonical V12 publication evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}')
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'DEVPOST_SUBMISSION_V12.md',
              'The YouTube page and 1080p selection were owner-confirmed before the scheduled premiere. Full post-premiere playback and the Devpost embedded-player review remain external acceptance gates.',
              'The video is now available as a standard public YouTube video. Independent publication verification returned HTTP 200 for YouTube oEmbed, the embeddable player endpoint, and the max-resolution thumbnail. Full start-to-finish playback and the Devpost embedded-player review remain external acceptance gates.'
          )

          replace_exact(
              'README.md',
              'YouTube V12 premiere: https://youtu.be/dEWJ2eGiDO8\n\nThe YouTube page and 1080p selection were owner-confirmed before the scheduled premiere; full post-premiere playback and Devpost embed acceptance remain external gates.',
              'YouTube V12 video: https://youtu.be/dEWJ2eGiDO8\n\nThe video is now available as a standard public YouTube video. Independent verification returned HTTP 200 for YouTube oEmbed, the embeddable player endpoint, and the max-resolution thumbnail. Full start-to-finish playback and Devpost embed acceptance remain external gates.'
          )

          old_media = '''## YouTube publication

```text
Video ID: dEWJ2eGiDO8
Short URL: https://youtu.be/dEWJ2eGiDO8
Canonical watch URL: https://www.youtube.com/watch?v=dEWJ2eGiDO8
Scheduled premiere: 5 August 2026, 21:00 Europe/Kyiv
Owner-confirmed page availability: PASS
Owner-confirmed 1080p selection: PASS
```

An unauthenticated `yt-dlp` probe from a GitHub-hosted runner was blocked by YouTube's anti-bot challenge. It is retained only as evidence of that probe limitation and is not interpreted as a video failure.

## Publication gate

Technical render and automated QA: PASS.

The YouTube page and 1080p selection are owner-confirmed. Full playback after the scheduled premiere and verification of the embedded Devpost player remain the final external publication gates.'''

          new_media = '''## YouTube publication

```text
Video ID: dEWJ2eGiDO8
Short URL: https://youtu.be/dEWJ2eGiDO8
Canonical watch URL: https://www.youtube.com/watch?v=dEWJ2eGiDO8
Publication mode: standard public video; premiere removed by owner
YouTube oEmbed endpoint: PASS (HTTP 200)
YouTube embeddable-player endpoint: PASS (HTTP 200)
YouTube max-resolution thumbnail endpoint: PASS (HTTP 200)
OEmbed title: EvidenceBound DataHub Gate
OEmbed author: RV
Owner-confirmed 1080p selection: PASS
```

The successful publication probe ran on a GitHub-hosted runner as workflow run `31024839874`. Its retained artifact digest is `sha256:09aeef97414587143b28a4e20ad26402cf44fa5e644a211dda26b70f709afc9f`.

An earlier unauthenticated `yt-dlp` metadata probe was blocked by YouTube's anti-bot challenge. The later official oEmbed, embed, and thumbnail endpoint checks passed; the earlier anti-bot result is therefore retained only as a probe limitation and not interpreted as a video failure.

## Publication gate

Technical render and automated QA: PASS.

Public YouTube publication and embeddability: PASS. Full start-to-finish playback in the processed YouTube stream and verification of the embedded Devpost player remain the final external publication gates.'''

          replace_exact('submission/DATAHUB_DEVPOST_MEDIA_V12.md', old_media, new_media)

          proof_path = Path('submission/datahub-v12-video-proof.json')
          proof = json.loads(proof_path.read_text())
          gate = proof['publication_gate']
          gate.update({
              'owner_playback_review': 'REQUIRED_FULL_START_TO_FINISH',
              'youtube_processed_playback_review': 'PUBLIC_ENDPOINTS_PASS_FULL_PLAYBACK_REQUIRED',
              'devpost_embedded_player_review': 'REQUIRED',
              'external_video_url': 'https://youtu.be/dEWJ2eGiDO8',
              'youtube_video_id': 'dEWJ2eGiDO8',
              'canonical_watch_url': 'https://www.youtube.com/watch?v=dEWJ2eGiDO8',
              'scheduled_premiere_at': None,
              'youtube_publication_mode': 'STANDARD_PUBLIC_VIDEO_OWNER_CONFIRMED',
              'youtube_page_owner_review': 'PASS',
              'youtube_1080p_owner_review': 'PASS',
              'youtube_oembed_review': 'PASS_HTTP_200',
              'youtube_embed_endpoint_review': 'PASS_HTTP_200',
              'youtube_maxres_thumbnail_review': 'PASS_HTTP_200',
              'youtube_oembed_title': 'EvidenceBound DataHub Gate',
              'youtube_oembed_author_name': 'RV',
              'youtube_publication_verification_run': 31024839874,
              'youtube_publication_artifact_digest': 'sha256:09aeef97414587143b28a4e20ad26402cf44fa5e644a211dda26b70f709afc9f',
              'youtube_automated_metadata_probe': 'PASS_VIA_OEMBED_EMBED_AND_THUMBNAIL_ENDPOINTS',
              'youtube_earlier_ytdlp_probe': 'BLOCKED_YOUTUBE_ANTI_BOT'
          })
          proof_path.write_text(json.dumps(proof, indent=2) + '\n')

          verification = {
              'schema_version': 'evidencebound-youtube-publication-verification-v1',
              'verified_at': '2026-08-05T16:21:02Z',
              'video_id': 'dEWJ2eGiDO8',
              'watch_url': 'https://www.youtube.com/watch?v=dEWJ2eGiDO8',
              'short_url': 'https://youtu.be/dEWJ2eGiDO8',
              'publication_mode': 'STANDARD_PUBLIC_VIDEO_OWNER_CONFIRMED',
              'premiere_active': False,
              'oembed_status': 200,
              'embed_status': 200,
              'thumbnail_status': 200,
              'title': 'EvidenceBound DataHub Gate',
              'author_name': 'RV',
              'provider_name': 'YouTube',
              'thumbnail_url': 'https://i.ytimg.com/vi/dEWJ2eGiDO8/hqdefault.jpg',
              'oembed_iframe_present': True,
              'embed_html_sha256': 'a3e924113c07e191efbd8f3df653f5894a359ed2213a3631dae6829268e20982',
              'maxres_thumbnail_sha256': '0d71315919b9357f73f9125534f927f5f96efacdfa40fdffeb1f253d39a8a6fa',
              'workflow_run': 31024839874,
              'workflow_head_sha': 'e761ba0797b6acbc6b2aa3d7296b5a0a9ee2ba60',
              'artifact_digest': 'sha256:09aeef97414587143b28a4e20ad26402cf44fa5e644a211dda26b70f709afc9f',
              'public_page_and_embed_endpoints': 'PASS',
              'full_start_to_finish_playback_verified': False,
              'devpost_embed_verified': False,
              'boundary': 'Endpoint verification proves public oEmbed, embed, and thumbnail availability. It does not independently prove full audio/video playback, duration, or every rendered frame.'
          }
          Path('submission/youtube-v12-publication-verification.json').write_text(json.dumps(verification, indent=2) + '\n')
          PY

          rm .github/workflows/bind-youtube-v12-public-now.yml

      - name: Commit verified public-video state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVPOST_SUBMISSION_V12.md README.md submission/DATAHUB_DEVPOST_MEDIA_V12.md submission/datahub-v12-video-proof.json submission/youtube-v12-publication-verification.json .github/workflows/bind-youtube-v12-public-now.yml
          git commit -m 'docs: verify V12 public YouTube publication [youtube-public-bound]'
          git push origin HEAD:docs/youtube-v12-public-now
