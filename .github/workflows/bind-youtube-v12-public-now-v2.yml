name: bind-youtube-v12-public-now-v2

on:
  push:
    branches:
      - docs/youtube-v12-public-now

permissions:
  contents: write

jobs:
  bind-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/youtube-v12-public-now
          fetch-depth: 0

      - name: Patch publication evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/patch_youtube_public.py
          python /tmp/patch_youtube_public.py
          rm -f .github/workflows/bind-youtube-v12-public-now.yml
          rm -f .github/workflows/bind-youtube-v12-public-now-v2.yml

      - name: Commit verified public-video state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: verify V12 public YouTube publication [youtube-public-bound]'
          git push origin HEAD:docs/youtube-v12-public-now
