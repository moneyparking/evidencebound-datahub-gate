name: independent-reproduction

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-clone-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Run advertised zero-state judge command
        shell: bash
        run: |
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            LANG=C.UTF-8 \
            CI=true \
            make test-repro

      - name: Reproduce retained VERIFIED and BLOCKED packs through Makefile
        shell: bash
        run: |
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            LANG=C.UTF-8 \
            CI=true \
            make verify-packs

      - name: Record exact-head reproduction evidence
        run: |
          {
            echo '# Independent reproduction'
            echo
            echo "- UTC: $(date -u +%FT%TZ)"
            echo "- Commit: $GITHUB_SHA"
            echo '- Environment: fresh GitHub-hosted Ubuntu runner'
            echo '- Advertised command: make test-repro'
            echo '- Project environment variables: cleared with env -i'
            echo '- Validation: PASS'
            echo '- Controlled VERIFIED pack: REPRODUCED'
            echo '- Controlled BLOCKED pack: REPRODUCED'
            echo '- Claim boundary: no production, certification, customer-acceptance or deployment-authorization claim'
          } >> "$GITHUB_STEP_SUMMARY"
